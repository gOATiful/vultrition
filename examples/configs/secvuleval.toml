[dataset]
name="SecVulEval"
description = "SecVulEval is a collection of real-world C/C++ vulnerabilities."
version = "bde3e7c"
license = "MIT"
languages="cpp"
has_runable_code_or_test_cases=false

[dataset.files]
data="datasets/secvuleval/secvuleval_extracted.jsonl"

[dataset.fields]
function="function"
label="label"
vuln_label_value=1
cve="cve"
cwe="cwe"
project="project"

[dataset.analysis.quiality_metrics]
completeness=true
diversity=true
balance=true
timespan=true
uniqueness=false
cross_contamination=false

[dataset.analysis.structural_metrics]
loc=true
tokens=true
cyclomatic_complexity=true