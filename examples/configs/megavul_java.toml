[dataset]
name="MegaVul"
description = "The largest, high-quality, extensible, continuously updated, C/C++/Java function-level vulnerability dataset."
version = "bde3e7c"
license = "GPL-3.0"
languages="java"
has_runable_code_or_test_cases=false

[dataset.files]
data="datasets/megavul/megavul_simple_java_filtered.jsonl"

[dataset.fields]
function="function"
label="label"
vuln_label_value=1
cve="cve"
cwe="cwe"
project="project"

[dataset.analysis.quiality_metrics]
completeness=true
diversity=true
balance=true
timespan=true
uniqueness=true
cross_contamination=true

[dataset.analysis.structural_metrics]
loc=true
tokens=true
cyclomatic_complexity=true