[dataset]
name="ICVul"
description = "A Well-labeled C/C++ Vulnerability Dataset with Comprehensive Metadata and VCCs"
version = "3dc5504"
license = "MIT"
languages="cpp"
has_runable_code_or_test_cases=false

[dataset.files]
data="datasets/icvul/icvul.jsonl"

[dataset.fields]
function="function"
label="label"
vuln_label_value=1
cve="cve"
cwe="cwe"
project="project"

[dataset.analysis.quiality_metrics]
completeness=true
diversity=true
balance=true
timespan=true
uniqueness=true
cross_contamination=true

[dataset.analysis.structural_metrics]
loc=true
tokens=true
cyclomatic_complexity=true